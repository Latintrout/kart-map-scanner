<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kart Map Scanner Tests</title>
<style>
  :root { --bg: #16161d; --panel: #20202a; --line: #33334a; --text: #e8e8f0; --muted: #9a9ab0; --ok: #52b788; --err: #ff6b6b; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Segoe UI", sans-serif;
    padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
  main { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin-bottom: 16px; }
  #summary { padding: 12px 14px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); font-weight: 600; margin-bottom: 12px; }
  #summary.ok { color: var(--ok); } #summary.err { color: var(--err); }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 5px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
  .tag { font-weight: 700; min-width: 3.2em; font-variant-numeric: tabular-nums; }
  .pass .tag { color: var(--ok); } .fail .tag { color: var(--err); }
  .detail { color: var(--muted); font-size: 12px; word-break: break-word; }
  a { color: var(--text); }
</style>
</head>
<body>
<main>
  <h1>Kart Map Scanner tests</h1>
  <div class="sub">Checks every feature from v1 onward against the live <a href="../">scanner page</a>. Green means nothing old broke.</div>
  <div id="summary">Running…</div>
  <ul id="list"></ul>
</main>
<script src="scanner-tests.js"></script>
<script>
(async () => {
  const summary = document.getElementById('summary'), list = document.getElementById('list');
  try {
    const html = await (await fetch('../index.html', { cache: 'no-store' })).text();
    const start = html.indexOf('// PURE-START'), end = html.indexOf('// PURE-END');
    if (start < 0 || end < 0) throw new Error('could not find the scanner code markers in index.html');
    const code = html.slice(html.lastIndexOf('\n', start), end);
    const names = [...code.matchAll(/^function\s+([A-Za-z0-9_]+)/gm)].map(m => m[1]);
    const lib = new Function(code + '\nreturn {' + names.join(',') + '};')();
    const results = runScannerTests(lib);
    const failed = results.filter(r => !r.pass);
    summary.textContent = failed.length ? `${failed.length} of ${results.length} checks FAILED` : `All ${results.length} checks passed`;
    summary.className = failed.length ? 'err' : 'ok';
    for (const r of results) {
      const li = document.createElement('li');
      li.className = r.pass ? 'pass' : 'fail';
      li.innerHTML = `<span class="tag">${r.pass ? 'PASS' : 'FAIL'}</span><span></span>`;
      li.lastChild.textContent = r.name;
      if (!r.pass && r.detail) { const d = document.createElement('div'); d.className = 'detail'; d.textContent = r.detail; li.lastChild.appendChild(d); }
      list.appendChild(li);
    }
  } catch (e) {
    summary.textContent = 'Could not run the tests: ' + e.message + '. (Open this page from the website or the local launcher, not as a file.)';
    summary.className = 'err';
  }
})();
</script>
</body>
</html>
